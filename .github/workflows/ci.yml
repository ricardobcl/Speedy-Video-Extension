name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: make
      - name: Committed build must match src (if this fails, run 'make' and commit)
        run: |
          git status --short -- chrome
          test -z "$(git status --porcelain -- chrome)"
