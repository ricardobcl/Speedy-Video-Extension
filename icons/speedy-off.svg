<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- the toolbar icon of a tab Speedy Video doesn't run in: speedy.svg in
       one flat grey with the arrows cut out, which also works as the template
       image Safari makes of grey icons -->
  <defs>
    <mask id="cutout">
      <rect width="256" height="256" fill="#fff"/>
      <g stroke="#000" stroke-linecap="round" stroke-width="12">
        <line x1="26" y1="96" x2="46" y2="96" opacity=".65"/>
        <line x1="20" y1="128" x2="44" y2="128" opacity=".45"/>
        <line x1="26" y1="160" x2="46" y2="160" opacity=".3"/>
      </g>
      <path d="M 59 84 L 119 128 L 59 172 Z" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
      <path d="M 137 84 L 197 128 L 137 172 Z" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#8e8e93" mask="url(#cutout)"/>
</svg>
